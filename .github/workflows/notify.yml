name: SPK IPO notifications

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Check for new IPOs/applications and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/check_and_notify.py --state-file state/seen_records.json

      # KAP PDFs and Gemini analysis results are pure caches (like the
      # rest of data/cache/*, gitignored — see .gitignore), not
      # notification state, so they persist across runs via the
      # Actions cache rather than being committed to the repo like
      # state/seen_records.json below. Restored here, saved
      # automatically at the end of the job.
      - name: Restore KAP PDF and Gemini analysis caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache/kap_pdfs
            data/cache/llm_analysis
          key: llm-analysis-cache-${{ github.run_id }}
          restore-keys: |
            llm-analysis-cache-

      - name: Fetch and cache KAP disclosure documents
        run: uv run python scripts/fetch_kap_disclosures.py --parse-documents > /dev/null

      - name: Run Gemini analysis for pending IPOs
        # A quota/rate-limit/temporary Gemini error must not fail the
        # whole monitoring workflow — analyze_pending_ipos.py already
        # skips just the affected company per-record (see its
        # GeminiUnavailableError handling), and pending companies are
        # naturally retried on the next hourly run since nothing gets
        # cached for a skipped/failed one. continue-on-error is a second
        # layer of protection for a total-outage/full-preflight failure.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python scripts/analyze_pending_ipos.py > /dev/null

      - name: Send pending Gemini analysis notifications
        # Same protection as the analysis step above: a temporary
        # Telegram failure must not fail the workflow.
        # send_pending_analyses.py only records a company as sent (in
        # state/sent_analyses.json) *after* a successful delivery, and
        # that file is only committed below once the script has
        # finished — so a failed send simply leaves that company unsent
        # for the next hourly run to retry, and nothing gets committed
        # until delivery actually succeeded.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/send_pending_analyses.py --state-file state/sent_analyses.json

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_records.json state/sent_analyses.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update seen IPO records and sent-analysis state"
            git push
          fi
