name: SPK IPO notifications

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    # Backstop only, not the fix: with the historical-backfill/issuer-IR
    # crawl steps moved to their own workflow (see backfill.yml), a
    # normal run now finishes in ~15-25 minutes. This bounds the
    # worst case (e.g. a genuinely stuck external call) instead of
    # letting a stalled run silently eat the default 360-minute cap.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Check for new IPOs/applications and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/check_and_notify.py --state-file state/seen_records.json

      # actions/cache's post-job save step needs all four paths to
      # exist — normally guaranteed by the fetch/analysis steps below
      # writing at least one file, but not on a run that matches/
      # analyzes nothing (e.g. no KAP disclosures at all in the
      # lookback window).
      - name: Ensure cache directories exist
        run: mkdir -p data/cache/kap_pdfs data/cache/llm_analysis data/cache/kap_ocr data/cache/evds

      # KAP PDFs, Gemini analysis results, OCR text, and the EVDS
      # market-context cache are pure caches (like the rest of
      # data/cache/*, gitignored — see .gitignore), not notification
      # state, so they persist across runs via the Actions cache rather
      # than being committed to the repo like state/seen_records.json
      # below. Restored here, saved automatically at the end of the job.
      # data/cache/evds is what lets scripts/refresh_evds_market_context.py
      # only ever request the gap since its own last cached observation.
      #
      # This also restores data/cache/kap_backfill and data/cache/kap_issuer_ir
      # — populated by the separate, low-frequency backfill.yml workflow
      # (historical KAP search / issuer-IR crawling; see that file for
      # why it doesn't belong in this hourly job) — even though this job
      # never writes to them itself, so scripts/analyze_pending_ipos.py
      # and scripts/send_pending_analyses.py below can merge in whatever
      # backfill.yml already found via their own cheap, network-free
      # cache reads (see halka_arz_advisor.kap.backfill.merge_backfilled_disclosures
      # and halka_arz_advisor.issuer_ir.ingest.collect_supplementary_disclosures).
      - name: Restore KAP PDF, Gemini analysis, OCR, backfill, issuer-IR, and EVDS caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache/kap_pdfs
            data/cache/llm_analysis
            data/cache/kap_ocr
            data/cache/kap_backfill
            data/cache/kap_issuer_ir
            data/cache/evds
          key: llm-analysis-cache-${{ github.run_id }}
          restore-keys: |
            llm-analysis-cache-

      # Local OCR fallback for scanned/empty KAP PDFs (halka_arz_advisor.kap.ocr)
      # — Tesseract CLI with Turkish + English language data, no paid/
      # hosted API. continue-on-error: if this install fails, OCR simply
      # comes back "ocr_unavailable" for any document that needed it
      # (get_tesseract_version() returns None), same as a machine that
      # never had Tesseract at all — every other step still runs.
      - name: Install Tesseract OCR (tur+eng)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng

      - name: Fetch and cache KAP disclosure documents
        # Bounded to the recent-disclosure window only (see
        # scripts/fetch_kap_disclosures.py) — this is the "new SPK/KAP
        # data" step, not a historical search. timeout-minutes is a
        # backstop in case KAP itself stalls past its own per-request
        # timeout/retry budget (see halka_arz_advisor.probe.http_client);
        # a normal run finishes in a few minutes.
        timeout-minutes: 15
        run: uv run python scripts/fetch_kap_disclosures.py --parse-documents --ocr-scanned > /dev/null

      - name: Refresh EVDS market-context cache
        # Fully isolated from the KAP pipeline (halka_arz_advisor.evds) —
        # BIST 100 level/volume, TCMB's policy rate, BIST TLREF, and
        # TÜİK's headline CPI, persisted to data/cache/evds/ so a later
        # run only ever requests the gap. If the EVDS_API_KEY repository
        # secret isn't configured, the script itself detects that and
        # skips the refresh cleanly (exit 0) — continue-on-error is a
        # second layer of protection for a genuine EVDS outage, either
        # way cached market-context data (if any) remains usable by
        # scripts/audit_decision_coverage.py.
        continue-on-error: true
        timeout-minutes: 10
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: uv run python scripts/refresh_evds_market_context.py > /dev/null

      - name: Run Gemini analysis for pending IPOs
        # A quota/rate-limit/temporary Gemini error must not fail the
        # whole monitoring workflow — analyze_pending_ipos.py already
        # skips just the affected company per-record (see its
        # GeminiUnavailableError handling), and pending companies are
        # naturally retried on the next hourly run since nothing gets
        # cached for a skipped/failed one. continue-on-error is a second
        # layer of protection for a total-outage/full-preflight failure.
        # timeout-minutes is a third: a normal run analyzes only the
        # small pending set and finishes well under this.
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python scripts/analyze_pending_ipos.py > /dev/null

      - name: Send pending Gemini analysis notifications
        # Same protection as the analysis step above: a temporary
        # Telegram failure must not fail the workflow.
        # send_pending_analyses.py only records a company as sent (in
        # state/sent_analyses.json) *after* a successful delivery, and
        # that file is only committed below once the script has
        # finished — so a failed send simply leaves that company unsent
        # for the next hourly run to retry, and nothing gets committed
        # until delivery actually succeeded.
        continue-on-error: true
        timeout-minutes: 20
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/send_pending_analyses.py --state-file state/sent_analyses.json

      - name: Commit updated state
        # Both state files are optional at this point: send_pending_analyses.py
        # (like analyze_pending_ipos.py before it) can return early — a
        # missing GEMINI_API_KEY/TELEGRAM_BOT_TOKEN, a KAP/SPK fetch
        # failure — before ever writing its state file, so
        # state/sent_analyses.json (and, in principle, state/seen_records.json)
        # may not exist yet. `git add` on a nonexistent path exits non-zero
        # and would abort this step under bash's default `-e`, so each is
        # only added if present.
        #
        # git push here can be legitimately rejected (non-fast-forward)
        # by any other commit landing on master while this job was
        # running — e.g. normal local development pushes, not just
        # another workflow run. That's an expected race, not a genuine
        # failure, so it's resolved with a rebase-and-retry loop rather
        # than failing the whole run outright (which previously
        # discarded this run's state update and risked re-sending
        # already-delivered notifications on the next run). A push
        # rejected for a real reason (e.g. an actual conflicting state
        # change) still surfaces as a genuine failure after the retries
        # are exhausted.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state/seen_records.json ] && git add state/seen_records.json
          [ -f state/sent_analyses.json ] && git add state/sent_analyses.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update seen IPO records and sent-analysis state"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "git push rejected (attempt $attempt/3) — rebasing onto the latest origin/master and retrying..."
            git pull --rebase origin master
          done
          echo "::error::git push failed after 3 attempts."
          exit 1
